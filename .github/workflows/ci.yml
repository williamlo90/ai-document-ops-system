name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Black check
        run: python -m black --check backend scripts run_tests.py
      - name: Ruff check
        run: python -m ruff check backend scripts run_tests.py
      - name: Tests
        run: python run_tests.py
      - name: Complexity report
        run: python scripts/quality_report.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e

  mock-provider-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Deterministic mock-provider smoke
        env:
          EXTRACTION_PROVIDER: mock
          AGENT_PROVIDER: mock
          PYTHONPATH: backend
        run: python -m unittest app.tests.test_provider_factory app.tests.test_services app.tests.test_backoffice_scenarios
