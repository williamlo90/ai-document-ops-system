name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.txt --disable-pip --strict
      - name: Format check
        run: python -m ruff format --check backend scripts run_tests.py
      - name: Ruff check
        run: python -m ruff check backend scripts run_tests.py
      - name: Tests
        run: python run_tests.py
      - name: Complexity report
        run: python scripts/quality_report.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e

  mock-provider-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Deterministic mock-provider smoke
        env:
          EXTRACTION_PROVIDER: mock
          AGENT_PROVIDER: mock
          PYTHONPATH: backend
        run: python -m unittest app.tests.test_provider_factory app.tests.test_services app.tests.test_backoffice_scenarios

  container-security:
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build immutable candidate image
        run: docker build --tag ai-document-ops-system:ci .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ai-document-ops-system:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
