name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/repo" \
            --workdir /repo \
            --entrypoint /bin/sh \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && gitleaks git --config /repo/.gitleaks.toml --redact=100 --no-banner /repo'

  clean-python-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.14", "3.12.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-locked environment into a fresh virtual environment
        run: |
          python -m venv .clean-venv
          .clean-venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify lock regeneration is stable on Python 3.11
        if: startsWith(matrix.python-version, '3.11')
        run: |
          .clean-venv/bin/python -m piptools compile \
            --generate-hashes --resolver=backtracking --strip-extras --allow-unsafe --no-annotate \
            --no-emit-index-url --output-file=requirements.txt requirements.in
          .clean-venv/bin/python -m piptools compile \
            --generate-hashes --resolver=backtracking --strip-extras --allow-unsafe --no-annotate \
            --no-emit-index-url --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt

  clean-python-install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.11.9 is the final CPython 3.11 release with a Windows installer.
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev-windows.txt
      - name: Install and regenerate the Windows hash locks
        shell: pwsh
        run: |
          python -m venv .clean-venv
          .\.clean-venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev-windows.txt
          .\.clean-venv\Scripts\python.exe -m piptools compile `
            --generate-hashes --resolver=backtracking --strip-extras --allow-unsafe --no-annotate `
            --no-emit-index-url --output-file=requirements-windows.txt requirements.in
          .\.clean-venv\Scripts\python.exe -m piptools compile `
            --generate-hashes --resolver=backtracking --strip-extras --allow-unsafe --no-annotate `
            --no-emit-index-url --output-file=requirements-dev-windows.txt requirements-dev.in
          git diff --exit-code -- requirements-windows.txt requirements-dev-windows.txt

  quality:
    runs-on: ubuntu-latest
    needs: clean-python-install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.txt --disable-pip --strict
      - name: Format check
        run: python -m ruff format --check backend scripts run_tests.py
      - name: Ruff check
        run: python -m ruff check backend scripts run_tests.py
      - name: Backend type check
        run: python -m mypy
      - name: Tests with branch coverage
        run: python -m coverage run --branch --source=backend/app run_tests.py
      - name: Coverage gate
        run: python scripts/coverage_gate.py
      - name: Complexity gate
        run: python scripts/quality_report.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e

  mock-provider-smoke:
    runs-on: ubuntu-latest
    needs: clean-python-install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Deterministic mock-provider smoke
        env:
          EXTRACTION_PROVIDER: mock
          AGENT_PROVIDER: mock
          PYTHONPATH: backend
        run: python -m unittest app.tests.test_provider_factory app.tests.test_services app.tests.test_backoffice_scenarios

  container-security:
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build immutable candidate image
        run: docker build --tag ai-document-ops-system:ci .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ai-document-ops-system:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
