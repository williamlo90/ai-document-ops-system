name: Controlled real-provider smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: real-provider-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run credentialed provider checks outside pull requests
        env:
          EXTRACTOR_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EXTRACTOR_ENDPOINT: https://api.openai.com/v1/chat/completions
          EXTRACTOR_MODEL: gpt-5.4-mini-2026-03-17
          EXTRACTOR_ALLOWED_HOSTS: api.openai.com
          PYTHONPATH: backend
        run: |
          test -n "$MISTRAL_API_KEY" || { echo "MISTRAL_API_KEY is not configured"; exit 1; }
          test -n "$EXTRACTOR_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          python -m unittest app.tests.test_real_providers app.tests.test_evaluation_real
          python scripts/run_current_provider_evaluation.py \
            "$RUNNER_TEMP/current-provider-smoke.json" \
            --max-documents 1
