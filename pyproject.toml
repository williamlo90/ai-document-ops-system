[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008", "B017"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = [
  "backend/app/main.py",
  "backend/app/core/settings.py",
  "backend/app/core/observability.py",
  "backend/app/core/security.py",
  "backend/app/core/http_headers.py",
  "backend/app/core/http_security.py",
  "backend/app/core/transactions.py",
  "backend/app/core/upload_scanning.py",
  "backend/app/providers",
  "backend/app/benchmark",
  "backend/app/evaluation",
  "backend/app/core/provider_egress.py",
  "backend/app/api",
  "backend/app/bootstrap",
  "backend/app/documents",
  "backend/app/extraction",
  "backend/app/validation",
  "backend/app/review",
  "backend/app/invoices",
  "backend/app/agent",
  "backend/app/backoffice",
  "backend/app/exports",
  "backend/app/operations",
  "backend/app/contracts",
]
strict = true
